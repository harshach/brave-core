substitutions:
  - description: Include Brave download-bubble strings used by this override.
    regex:
      pattern: '#include "chrome/grit/generated_resources.h"'
      replace: '#include "chrome/grit/generated_resources.h"\n#include "brave/grit/brave_generated_resources.h"'

  - description: |
      Add fall-through case handling for Brave-specific download commands.

      These commands are not used by the DownloadUIModel, so they fall through
      alongside EDIT_WITH_MEDIA_APP.
    count: 3
    regex:
      re_pattern: '(\n *)(case DownloadCommands::EDIT_WITH_MEDIA_APP:)'
      replace: |-
        \1\2
            case DownloadCommands::REMOVE_FROM_LIST:
            case DownloadCommands::DELETE_LOCAL_FILE:
            case DownloadCommands::COPY_DOWNLOAD_LINK:

  - description: |
      There's inconsistency between the download bubble and brave://downloads
      page in showing "File removed" status for removed files. To keep the
      consistency, use IDS_DOWNLOAD_FILE_REMOVED so both the download bubble and
      brave://downloads page show "Deleted" for removed files.
    regex:
      pattern: 'IDS_DOWNLOAD_STATUS_REMOVED'
      replace: 'IDS_DOWNLOAD_FILE_REMOVED'

  - description: |
      Keep fully received downloads in a finalizing state until Chromium marks
      them complete instead of showing the completed "Done" status early.
    regex:
      pattern: '// "120 MB • Done"'
      replace: '// "120 MB • Finishing…"'

  - description: Use the finalizing status for a fully received download.
    regex:
      pattern: 'return StatusTextBuilderUtils::GetCompletedTotalSizeString(total_bytes);'
      replace: 'return get_total_string(l10n_util::GetStringUTF16(IDS_BRAVE_DOWNLOAD_BUBBLE_STATUS_FINISHING));'
