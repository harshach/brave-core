name: Publish Socket macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example socket-v0.1.0-preview.1
        required: true
        type: string
      prerelease:
        description: Mark this as a prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "socket-v*"

permissions:
  contents: write

concurrency:
  group: socket-macos-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI: "true"
  GIT_CACHE_PATH: ${{ github.workspace }}/workspace/.git-cache
  NINJA_SUMMARIZE_BUILD: "1"
  ADBLOCK_PACKAGER_COMMIT: c10192f81fe62893ad04370a128e7c4a13599588
  ADBLOCK_LISTS_COMMIT: bc76984fbe2a054a5e1a51cd5ab9346db59aee45

jobs:
  release:
    name: Build, sign, notarize, and publish
    environment: socket-release
    runs-on:
      - self-hosted
      - socket-build
      - macOS
      - ARM64
    timeout-minutes: 960

    steps:
      - name: Resolve release settings
        id: release
        shell: bash
        env:
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$DISPATCH_TAG"
            prerelease="$DISPATCH_PRERELEASE"
          else
            release_tag="$GITHUB_REF_NAME"
            version="${release_tag#socket-v}"
            if [[ "$version" == *-* ]]; then
              prerelease=true
            else
              prerelease=false
            fi
          fi

          if [[ ! "$release_tag" =~ ^socket-v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Release tag must start with socket-v." >&2
            exit 1
          fi

          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check runner and release credentials
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "Socket's universal build requires an Apple Silicon runner." >&2
            exit 1
          fi

          for name in \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_ID \
            APPLE_TEAM_ID \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing socket-release secret: $name" >&2
              exit 1
            fi
          done

          available_kib="$(df -Pk "$RUNNER_WORKSPACE" | awk 'NR == 2 {print $4}')"
          if (( available_kib < 262144000 )); then
            echo "The runner needs at least 250 GiB free; only $((available_kib / 1048576)) GiB is available." >&2
            exit 1
          fi

      - name: Check out brave-core
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          path: workspace/src/brave

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Check out Brave Ad Block packager
        uses: actions/checkout@v7.0.1
        with:
          repository: brave/brave-core-crx-packager
          ref: ${{ env.ADBLOCK_PACKAGER_COMMIT }}
          fetch-depth: 1
          submodules: true
          path: workspace/adblock-packager

      - name: Generate public ad-block components
        working-directory: workspace/adblock-packager
        run: |
          npm ci
          npm run data-files-ad-block-rust -- --commit-hash "$ADBLOCK_LISTS_COMMIT"
          npm run generate-ad-block-manifests
          npm run package-ad-block -- --local-run
          mkdir -p ../src/brave/.socket-build
          cp -R build/ad-block-updater ../src/brave/.socket-build/

      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain_name="socket-build-$GITHUB_RUN_ID"
          keychain_path="$HOME/Library/Keychains/$keychain_name.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          notary_profile="socket-notary-$GITHUB_RUN_ID"
          certificate_path="$RUNNER_TEMP/socket-certificate-$GITHUB_RUN_ID.p12"
          original_keychains="$RUNNER_TEMP/socket-keychains-$GITHUB_RUN_ID.txt"

          echo "SOCKET_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "SOCKET_KEYCHAIN_NAME=$keychain_name" >> "$GITHUB_ENV"
          echo "SOCKET_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "SOCKET_NOTARY_PROFILE=$notary_profile" >> "$GITHUB_ENV"
          echo "SOCKET_ORIGINAL_KEYCHAINS=$original_keychains" >> "$GITHUB_ENV"

          security list-keychains -d user > "$original_keychains"
          printf '%s' "$MACOS_CERTIFICATE_P12" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 57600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          existing_keychains=()
          while IFS= read -r line; do
            line="${line#*\"}"
            line="${line%\"}"
            existing_keychains+=("$line")
          done < "$original_keychains"
          security list-keychains -d user -s \
            "$keychain_path" \
            "${existing_keychains[@]}"

          identities="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')"
          identity_count="$(printf '%s\n' "$identities" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$identity_count" != "1" ]]; then
            echo "The P12 must contain exactly one Developer ID Application identity." >&2
            exit 1
          fi

          xcrun notarytool store-credentials "$notary_profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"

          echo "identity=$identities" >> "$GITHUB_OUTPUT"

      - name: Configure optimized Socket release
        working-directory: workspace/src/brave
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          umask 077
          printf '%s\n' \
            'is_brave_origin_branded=true' \
            'is_socket_branded=true' \
            'is_brave_release_build=1' \
            'dcheck_always_on=false' \
            'brave_services_key=socket-community-build' \
            'service_key_search=socket-community-build' \
            'service_key_stt=socket-community-build' \
            'origin_adblock_components_dir="//brave/.socket-build/ad-block-updater"' \
            "mac_signing_identifier=$SIGNING_IDENTITY" \
            "mac_signing_keychain=$SOCKET_KEYCHAIN_NAME" \
            "mac_notary_keychain_profile=$SOCKET_NOTARY_PROFILE" > .env

      - name: Initialize Chromium workspace
        working-directory: workspace/src/brave
        run: >-
          pnpm run init
          --target_os=mac
          --target_arch=x64,arm64
          --no-history

      - name: Build Intel application
        working-directory: workspace/src/brave
        run: >-
          pnpm run build Release
          --target_os=mac
          --target_arch=x64
          --gn=should_generate_symbols:false

      - name: Build, sign, and notarize universal DMG
        working-directory: workspace/src/brave
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: >-
          pnpm run create_dist Release
          --target_os=mac
          --target_arch=arm64
          --universal
          --notarize
          --mac_signing_identifier="$SIGNING_IDENTITY"
          --mac_signing_keychain="$SOCKET_KEYCHAIN_NAME"
          --gn=should_generate_symbols:false

      - name: Verify and prepare release asset
        id: asset
        working-directory: workspace/src/brave
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          chrome_version="$(node -p 'require("./package.json").config.projects.chrome.tag')"
          dmg_path="../out/Release_arm64/packaged/Socket-$chrome_version.dmg"
          if [[ ! -f "$dmg_path" ]]; then
            echo "Expected Socket DMG was not produced: $dmg_path" >&2
            exit 1
          fi

          hdiutil verify "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature -vv "$dmg_path"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/socket-dmg.XXXXXX")"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT

          app_path="$mount_dir/Socket.app"
          test -d "$app_path"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$app_path/Contents/Info.plist")"
          if [[ "$bundle_id" != "com.harsha.Socket" ]]; then
            echo "Unexpected bundle identifier: $bundle_id" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute -vv "$app_path"
          architectures="$(lipo -archs "$app_path/Contents/MacOS/Socket")"
          if [[ "$architectures" != *arm64* || "$architectures" != *x86_64* ]]; then
            echo "DMG is not universal: $architectures" >&2
            exit 1
          fi

          hdiutil detach "$mount_dir"
          trap - EXIT

          release_version="${RELEASE_TAG#socket-v}"
          mkdir -p release-assets
          asset_path="release-assets/Socket-$release_version-macOS-universal.dmg"
          cp "$dmg_path" "$asset_path"
          shasum -a 256 "$asset_path" > "$asset_path.sha256"

          echo "path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "checksum=$asset_path.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: socket-macos-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            workspace/src/brave/${{ steps.asset.outputs.path }}
            workspace/src/brave/${{ steps.asset.outputs.checksum }}

      - name: Publish GitHub release
        working-directory: workspace/src/brave
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          assets=(release-assets/*)
          notes="Signed and notarized universal macOS build of Socket for Apple Silicon and Intel Macs. Socket is an independent browser and is not affiliated with Brave Software, Inc."

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          release_args=(
            --generate-notes
            --notes "$notes"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Socket ${RELEASE_TAG#socket-v}"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease --latest=false)
          else
            release_args+=(--latest)
          fi

          gh release create "$RELEASE_TAG" \
            "${release_args[@]}" \
            "${assets[@]}"

      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${SOCKET_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SOCKET_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${SOCKET_ORIGINAL_KEYCHAINS:-}" && -f "$SOCKET_ORIGINAL_KEYCHAINS" ]]; then
            original_keychains=()
            while IFS= read -r line; do
              line="${line#*\"}"
              line="${line%\"}"
              original_keychains+=("$line")
            done < "$SOCKET_ORIGINAL_KEYCHAINS"
            security list-keychains -d user -s "${original_keychains[@]}"
          fi
          rm -f \
            "${SOCKET_CERTIFICATE_PATH:-}" \
            "${SOCKET_ORIGINAL_KEYCHAINS:-}" \
            workspace/src/brave/.env
