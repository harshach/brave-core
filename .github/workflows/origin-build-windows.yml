name: Socket Windows binary

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: socket-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  GIT_CACHE_PATH: ${{ github.workspace }}/workspace/.git-cache
  NINJA_SUMMARIZE_BUILD: "1"

jobs:
  build:
    name: Socket Windows x64
    runs-on: [self-hosted, origin-build, Windows, X64]
    timeout-minutes: 720

    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out brave-core
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          path: workspace/src/brave

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Configure optimized Socket release
        working-directory: workspace/src/brave
        shell: pwsh
        run: |
          @(
            'is_brave_origin_branded=true'
            'is_brave_release_build=1'
            'dcheck_always_on=false'
            'brave_services_key=origin-community-build'
            'service_key_search=origin-community-build'
            'service_key_stt=origin-community-build'
          ) | Set-Content -Path .env -Encoding ascii

      - name: Initialize Chromium workspace
        working-directory: workspace/src/brave
        shell: pwsh
        run: >-
          pnpm run init
          --target_os=win
          --target_arch=x64
          --no-history

      - name: Build unsigned Socket installer
        working-directory: workspace/src/brave
        shell: pwsh
        run: >-
          pnpm run create_dist Release
          --target_os=win
          --target_arch=x64
          --skip_signing
          --gn=should_generate_symbols:false

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: socket-windows-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            workspace/src/out/**/brave_installer.exe
            workspace/src/out/**/BraveSocket*Setup*.exe
            workspace/src/out/**/dist/**/*.zip
